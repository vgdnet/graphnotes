name: graphnotes

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graphnotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-graphnotes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      GRAPHNOTES_ENVIRONMENT: ${GRAPHNOTES_ENVIRONMENT:-production}
      GRAPHNOTES_DATABASE_URL: ${GRAPHNOTES_DATABASE_URL:?set GRAPHNOTES_DATABASE_URL in .env}
      GRAPHNOTES_SESSION_TTL_HOURS: ${GRAPHNOTES_SESSION_TTL_HOURS:-168}
      GRAPHNOTES_COOKIE_SECURE: ${GRAPHNOTES_COOKIE_SECURE:-true}
      GRAPHNOTES_GITHUB_APP_ID: ${GRAPHNOTES_GITHUB_APP_ID:-}
      GRAPHNOTES_GITHUB_APP_INSTALLATION_ID: ${GRAPHNOTES_GITHUB_APP_INSTALLATION_ID:-}
      GRAPHNOTES_GITHUB_APP_PRIVATE_KEY_PATH: ${GRAPHNOTES_GITHUB_APP_PRIVATE_KEY_PATH:-/run/secrets/github-app.pem}
      GRAPHNOTES_GITHUB_SHARED_OWNER: ${GRAPHNOTES_GITHUB_SHARED_OWNER:-vgdnet}
      GRAPHNOTES_GITHUB_SHARED_NAME: ${GRAPHNOTES_GITHUB_SHARED_NAME:-rhizome}
      GRAPHNOTES_GITHUB_WEBHOOK_SECRET: ${GRAPHNOTES_GITHUB_WEBHOOK_SECRET:-}
      GRAPHNOTES_PERSONAL_SYNC_INTERVAL_SECONDS: ${GRAPHNOTES_PERSONAL_SYNC_INTERVAL_SECONDS:-300}
      GRAPHNOTES_SMTP_HOST: ${GRAPHNOTES_SMTP_HOST:-}
      GRAPHNOTES_SMTP_PORT: ${GRAPHNOTES_SMTP_PORT:-587}
      GRAPHNOTES_SMTP_USERNAME: ${GRAPHNOTES_SMTP_USERNAME:-}
      GRAPHNOTES_SMTP_PASSWORD: ${GRAPHNOTES_SMTP_PASSWORD:-}
      GRAPHNOTES_SMTP_FROM: ${GRAPHNOTES_SMTP_FROM:-}
      GRAPHNOTES_SMTP_USE_TLS: ${GRAPHNOTES_SMTP_USE_TLS:-true}
      GRAPHNOTES_PUBLIC_BASE_URL: ${GRAPHNOTES_PUBLIC_BASE_URL:-}
      GRAPHNOTES_TELEGRAM_BOT_TOKEN: ${GRAPHNOTES_TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ${GRAPHNOTES_GITHUB_APP_PRIVATE_KEY_HOST_PATH:-./.secrets/github-app.pem}:/run/secrets/github-app.pem:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - app

networks:
  app:

volumes:
  postgres_data:
